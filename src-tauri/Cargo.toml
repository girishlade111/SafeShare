[workspace]
resolver = "2"
members = ["pii_engine", "."]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["SafeShare"]
# `std::sync::LazyLock` (used to cache compiled regexes) needs 1.80.
rust-version = "1.80"

[package]
name = "safeshare"
version.workspace = true
description = "SafeShare - offline PII sanitization desktop app"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "safeshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pii_engine = { path = "./pii_engine" }